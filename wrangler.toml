# Cloudflare Pages কনফিগারেশন
name = "dramamovie3k"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------- D1 ডেটাবেস (Primary) ----------------
# functions/ এর ভেতর context.env.DB দিয়ে অ্যাক্সেস করা যাবে
[[d1_databases]]
binding = "DB"
database_name = "dramamovie3k"
database_id = "8a008190-7fec-4821-8875-90802016caac"

# ---------------- R2 স্টোরেজ (ছবি/ফাইল) ----------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dramamovie3k"

# ---------------- পাবলিক ভ্যারিয়েবল ----------------
# গোপন কী (SUPABASE_JWT_SECRET ইত্যাদি) এখানে নয় —
# Cloudflare Dashboard → Pages → Settings → Environment variables (Encrypted) এ রাখুন
[vars]
R2_PUBLIC_URL = "https://pub-89f3fc51674d4c82896d14b0468dcc2c.r2.dev"

# প্রিভিউ এনভায়রনমেন্টেও একই বাইন্ডিং
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "dramamovie3k"
database_id = "8a008190-7fec-4821-8875-90802016caac"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "dramamovie3k"

[env.preview.vars]
R2_PUBLIC_URL = "https://pub-89f3fc51674d4c82896d14b0468dcc2c.r2.dev"
